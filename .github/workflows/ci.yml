name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: JavaScript syntax
        run: node --check modules/ext.categoryMultisortNeue.js

      - name: JSON validity
        run: |
          # The PHP snippets below are single quoted for bash on purpose.  Inside a
          # run: block GitHub Actions performs its own expansion before bash ever
          # sees the command, so a snippet that reads an argument out of the argv
          # array silently loses it and fails with a confusing error.  That is why
          # each snippet globs its own file list, and why the JSON step uses an
          # error handler rather than JSON_THROW_ON_ERROR.
          php -r '
          set_error_handler( static function ( $severity, $message ) {
            throw new RuntimeException( $message );
          } );
          $files = [ "extension.json", "composer.json" ];
          foreach ( glob( "i18n/*.json" ) as $file ) { $files[] = $file; }
          foreach ( glob( "sql/*.json" ) as $file ) { $files[] = $file; }
          foreach ( $files as $file ) {
            json_decode( file_get_contents( $file ), true, 512 );
            if ( json_last_error() !== JSON_ERROR_NONE ) {
              fwrite( STDERR, $file . ": " . json_last_error_msg() . "\n" );
              exit( 1 );
            }
            echo "ok  " . $file . "\n";
          }'

      - name: Message keys are documented
        run: |
          php -r '
          $en = json_decode( file_get_contents( "i18n/en.json" ), true );
          $qqq = json_decode( file_get_contents( "i18n/qqq.json" ), true );
          unset( $en["@metadata"], $qqq["@metadata"] );
          $missing = array_diff( array_keys( $en ), array_keys( $qqq ) );
          $orphaned = array_diff( array_keys( $qqq ), array_keys( $en ) );
          if ( $missing ) {
            fwrite( STDERR, "undocumented messages: " . implode( ", ", $missing ) . "\n" );
          }
          if ( $orphaned ) {
            fwrite( STDERR, "qqq entries with no message: " . implode( ", ", $orphaned ) . "\n" );
          }
          if ( $missing || $orphaned ) { exit( 1 ); }
          echo count( $en ) . " messages, all documented\n";'

      - name: Documentation links resolve
        run: |
          php -r '
          $base = getcwd();
          $broken = [];
          foreach ( [ "README.md", "CONTRIBUTING.md", "docs/DESIGN.md" ] as $doc ) {
            if ( !file_exists( $doc ) ) { continue; }
            preg_match_all( "#\\]\\(([^)]+)\\)#", file_get_contents( $doc ), $matches );
            foreach ( $matches[1] as $target ) {
              if ( str_starts_with( $target, "http" ) || str_starts_with( $target, "#" ) ) {
                continue;
              }
              $target = explode( "#", $target )[0];
              if ( $target === "" ) { continue; }
              if ( !file_exists( $base . "/" . $target ) ) {
                $broken[] = $doc . " -> " . $target;
              }
            }
          }
          if ( $broken ) {
            fwrite( STDERR, implode( "\n", $broken ) . "\n" );
            exit( 1 );
          }
          echo "all documentation links resolve\n";'
