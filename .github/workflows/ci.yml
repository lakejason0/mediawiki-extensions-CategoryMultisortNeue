name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: JavaScript syntax
        run: node --check modules/ext.categoryMultisortNeue.js

      - name: JSON validity
        run: |
          for f in extension.json composer.json i18n/*.json sql/*.json; do
            php -r "json_decode(file_get_contents('\$argv[1]'), true, 512, JSON_THROW_ON_ERROR);" "$f"
            echo "ok  $f"
          done

      - name: Message keys are documented
        run: |
          php -r '
            $en = json_decode( file_get_contents( "i18n/en.json" ), true );
            $qqq = json_decode( file_get_contents( "i18n/qqq.json" ), true );
            $missing = array_diff( array_keys( $en ), array_keys( $qqq ) );
            if ( $missing ) {
              fwrite( STDERR, "undocumented messages: " . implode( ", ", $missing ) . "\n" );
              exit( 1 );
            }
            echo "all " . count( $en ) . " messages documented in qqq.json\n";
          '

      - name: Magic word definitions are valid
        run: php -l i18n/magicWords.php
